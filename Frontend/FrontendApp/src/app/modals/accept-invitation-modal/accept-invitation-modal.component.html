<ion-content class="ion-padding">
  <h2>Accept Tournament Invitation</h2>
  <p>Are you sure you want to accept the invitation for <strong>{{ tournamentName }}</strong>?</p>
  
  <ion-footer>
    <ion-button expand="full" color="success" (click)="confirm()">Accept</ion-button>
    <ion-button expand="full" color="medium" (click)="dismiss()">Cancel</ion-button>
  </ion-footer>
</ion-content>
