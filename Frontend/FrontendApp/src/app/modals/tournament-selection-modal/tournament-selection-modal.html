<ion-header>
  <ion-toolbar>
    <ion-title>Select a Tournament</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let tournament of predefinedTournaments" (click)="selectTournament(tournament.tournamentId)">
      <ion-label>{{ tournament.tournamentName }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
