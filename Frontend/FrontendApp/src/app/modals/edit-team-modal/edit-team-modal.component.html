<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEditing ? 'Edit Team' : 'Add New Team' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="teamForm" class="team-form">
    <!-- Team Name Input -->
    <div class="form-group">
      <ion-label class="selector-label">Team Name</ion-label>
      <ion-input formControlName="teamName" placeholder="Enter team name"></ion-input>
    </div>
    <div class="error-message" *ngIf="teamForm.get('teamName')?.hasError('required') && teamForm.get('teamName')?.touched">
      Team name is required.
    </div>
    <div class="error-message" *ngIf="teamForm.get('teamName')?.hasError('maxlength') && teamForm.get('teamName')?.touched">
      Team name cannot exceed 50 characters.
    </div>

    <!-- Save Button -->
    <div class="save-button-container">
      <ion-button expand="full" color="success" (click)="saveTeam()">Save</ion-button>
    </div>
  </form>
</ion-content>
