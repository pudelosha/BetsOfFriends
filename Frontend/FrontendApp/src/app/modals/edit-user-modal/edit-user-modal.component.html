<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEditing ? 'Edit User' : 'Add New User' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="userForm" class="user-form">
    <!-- User-Defined Name (Only If Available) -->
    <div class="form-group" *ngIf="user?.userName">
      <ion-label class="selector-label">User-Defined Name</ion-label>
      <ion-input formControlName="userName" readonly></ion-input>
    </div>

    <!-- Admin-Defined Name -->
    <div class="form-group">
      <ion-label class="selector-label">Admin-Defined Name</ion-label>
      <ion-input formControlName="userAdminName" placeholder="Enter admin-defined name"></ion-input>
    </div>
    <div class="error-message" *ngIf="userForm.get('userAdminName')?.hasError('required') && userForm.get('userAdminName')?.touched">
      Admin-defined name is required.
    </div>

    <!-- User Email -->
    <div class="form-group">
      <ion-label class="selector-label">User Email</ion-label>
      <ion-input formControlName="userEmail" type="email" placeholder="Enter user email"></ion-input>
    </div>
    <div class="error-message" *ngIf="userForm.get('userEmail')?.hasError('required') && userForm.get('userEmail')?.touched">
      User email is required.
    </div>
    <div class="error-message" *ngIf="userForm.get('userEmail')?.hasError('email') && userForm.get('userEmail')?.touched">
      Please enter a valid email address.
    </div>

    <!-- User Role Selection -->
    <div class="form-group">
      <ion-label class="selector-label">User Role</ion-label>
      <ion-segment formControlName="userRole">
        <ion-segment-button value="Player">
          <ion-label>Player</ion-label>
        </ion-segment-button>
        <ion-segment-button value="Admin">
          <ion-label>Admin</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <!-- Status (Always Read-Only) -->
    <div class="form-group">
      <ion-label class="selector-label">Status</ion-label>
      <ion-input formControlName="status" readonly></ion-input>
    </div>

    <!-- Save Button -->
    <div class="save-button-container">
      <ion-button expand="full" color="success" (click)="saveUser()">Save</ion-button>
    </div>
  </form>
</ion-content>
