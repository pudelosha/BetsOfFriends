<ion-header>
  <ion-toolbar>
    <ion-title>{{ index !== undefined ? 'Edit Match' : 'Add Match' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="matchForm" class="match-form">
    
    <!-- Home Team (Label + Selector in One Row) -->
    <div class="match-row">
      <ion-label class="selector-label">Home Team</ion-label>
      <ion-select formControlName="homeTeam" class="wide-select">
        <ion-select-option *ngFor="let team of teams" [value]="team">{{ team }}</ion-select-option>
      </ion-select>
    </div>

    <!-- Away Team (Label + Selector in One Row) -->
    <div class="match-row">
      <ion-label class="selector-label">Away Team</ion-label>
      <ion-select formControlName="awayTeam" class="wide-select">
        <ion-select-option *ngFor="let team of teams" [value]="team">{{ team }}</ion-select-option>
      </ion-select>
    </div>

    <!-- Bet Type (Label + Selector in One Row) -->
    <div class="match-row">
      <ion-label class="selector-label">Bet Type</ion-label>
      <ion-select formControlName="betType" class="wide-select">
        <ion-select-option value="90min">90min</ion-select-option>
        <ion-select-option value="90min+winner">90min+winner</ion-select-option>
      </ion-select>
    </div>

    <div class="divider"></div>

    <!-- Match Date & Time Section -->
    <div class="section-title">Match Date & Time</div>
    <div class="match-row">
      <ion-datetime displayFormat="YYYY-MM-DD HH:mm" formControlName="date" class="full-width"></ion-datetime>
    </div>

    <div class="divider"></div>

    <!-- 1X2 Odds Section -->
    <div class="section-title">1X2 Betting Odds</div>
    <div class="match-row">
      <ion-label class="match-label center-align">Home Win</ion-label>
      <ion-label class="match-label center-align">Draw</ion-label>
      <ion-label class="match-label center-align">Away Win</ion-label>
    </div>

    <div class="match-row">
      <ion-input type="number" formControlName="homeWinOdds" class="third-width odds-input"></ion-input>
      <ion-input type="number" formControlName="drawOdds" class="third-width odds-input"></ion-input>
      <ion-input type="number" formControlName="awayWinOdds" class="third-width odds-input"></ion-input>
    </div>

    <div class="divider"></div>

    <!-- Qualification Odds Section -->
    <div class="section-title">Qualification Odds</div>
    <div class="match-row">
      <ion-label class="match-label center-align">Home Qualifies</ion-label>
      <ion-label class="match-label center-align">Away Qualifies</ion-label>
    </div>

    <div class="match-row">
      <ion-input type="number" formControlName="homeQualifies" class="half-width odds-input"></ion-input>
      <ion-input type="number" formControlName="awayQualifies" class="half-width odds-input"></ion-input>
    </div>

    <div class="divider"></div>

    <!-- Save Button with Extra Spacing -->
    <div class="save-button-container">
      <ion-button expand="full" color="success" (click)="saveMatch()">Save</ion-button>
    </div>
  </form>
</ion-content>
