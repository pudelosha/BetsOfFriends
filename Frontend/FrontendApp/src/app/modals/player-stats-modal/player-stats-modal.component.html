<ion-header>
  <ion-toolbar>
    <ion-title>Player Stats</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="closeModal()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>

  <ion-list *ngIf="!isLoading">
    <ion-item *ngFor="let stat of stats">
      <ion-label>
        <h2>{{ stat.homeTeam }} vs {{ stat.awayTeam }}</h2>
        <p>Prediction: {{ stat.userPlacedResult }}</p>
        <p>Outcome: {{ stat.betOutcome }}</p>
        <p>Qualified Bet: {{ stat.whoQualifiedBet }}</p>
        <p>Qualified Result: {{ stat.whoQualifiedResult }}</p>
        <p>Payout: {{ stat.payout }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
