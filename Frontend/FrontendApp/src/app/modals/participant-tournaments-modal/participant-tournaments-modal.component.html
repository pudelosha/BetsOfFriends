<ion-header>
  <ion-toolbar>
    <ion-title>Select Tournament</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="modalController.dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="!isLoading">
  <div *ngFor="let tournament of tournaments" class="tournament-card" [ngClass]="{ 'selected-tournament': tournament.tournamentId === selectedTournamentId }">
    <ion-grid>
      <ion-row class="tournament-row">

        <!-- Tournament Info -->
        <ion-col size="9" class="tournament-info">
          <span class="tournament-title">{{ tournament.tournamentName }}</span>
          <span class="tournament-meta">
            Participants: {{ tournament.numberOfParticipants }}
          </span>
          <span class="tournament-role">
            Role: {{ tournament.role }}
          </span>
        </ion-col>

        <!-- Select Button -->
        <ion-col size="3" class="button-col">
          <ion-button
            expand="block"
            [disabled]="tournament.tournamentId === selectedTournamentId"
            [color]="tournament.tournamentId === selectedTournamentId ? 'medium' : 'primary'"
            fill="outline"
            (click)="selectTournament(tournament)">
            {{ tournament.tournamentId === selectedTournamentId ? 'Selected' : 'Select' }}
          </ion-button>
        </ion-col>
        
      </ion-row>
    </ion-grid>
  </div>
</ion-content>

<ion-content *ngIf="isLoading">
  <ion-spinner name="crescent" class="spinner-center"></ion-spinner>
</ion-content>
