<form [formGroup]="tournamentForm">
  <div class="page-description">
    <p>
      This page is accessible by the super admin to insert a tournament template 
      into the application, allowing people to bet on football games for fun with friends.
    </p>
    <p>
      Provide a tournament name and upload an Excel file or proceed to manually add teams and games.
    </p>
  </div>

  <div class="form-group">
    <ion-label class="form-label">Tournament Name</ion-label>
    <ion-input 
      formControlName="tournamentName" 
      class="tournament-name-input full-width"
      placeholder="Enter tournament name">
    </ion-input>
  </div>
</form>

<div class="file-upload-container">
  <div class="file-input-wrapper">
    <input type="file" class="file-input" (change)="handleFileInput($event)">
  </div>
</div>
