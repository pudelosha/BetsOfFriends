<!-- Loading Spinner -->
<ion-spinner *ngIf="isLoading" class="loading-spinner" name="crescent"></ion-spinner>

<!-- Display Message if No Matches Found -->
<div *ngIf="!isLoading && !matches.length && errorMessage" class="no-matches">
  <p>{{ 'MANAGE_CUSTOM_UPCOMING.NO_MATCHES' | translate }}</p>
</div>

<!-- Match List -->
<ion-list *ngIf="!isLoading && matches.length > 0" class="match-list">
  <ion-item *ngFor="let match of matches" class="match-item">
    <div class="match-grid">
      <div class="match-details">
        <span class="team">{{ match.homeTeam }}</span>
        <span class="team">{{ match.awayTeam }}</span>
      </div>

      <div class="match-date">
        <span class="date">{{ match.matchStart | date: 'yyyy.MM.dd' }}</span>
        <span class="time">{{ match.matchStart | date: 'HH:mm' }}</span>
      </div>

      <div class="match-button-container">
        <ion-button size="small" class="match-button" color="medium" (click)="editMatchResult(match, $event)">
          {{ 'MANAGE_CUSTOM_UPCOMING.EDIT_BUTTON' | translate }}
        </ion-button>
      </div>
    </div>
  </ion-item>
</ion-list>
