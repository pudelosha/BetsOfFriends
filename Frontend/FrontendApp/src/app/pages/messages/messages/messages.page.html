<ion-content class="ion-padding page-with-header">

      <!-- Sticky Pagination Bar at Top -->
      <div class="sticky-pagination-bar-top">
        <div class="sticky-inner">
          <ion-grid class="full-width">
            <ion-row class="ion-justify-content-center ion-align-items-center">
              <ion-col size="auto">
                <ion-button fill="clear" (click)="prevPage()" [disabled]="currentPage === 1">
                  <ion-icon name="chevron-back-outline"></ion-icon>
                </ion-button>
              </ion-col>

              <ion-col size="auto">
                <span class="page-indicator">{{ currentPage }} / {{ totalPages }}</span>
              </ion-col>

              <ion-col size="auto">
                <ion-button fill="clear" (click)="nextPage()" [disabled]="currentPage === totalPages">
                  <ion-icon name="chevron-forward-outline"></ion-icon>
                </ion-button>
              </ion-col>
            </ion-row>
          </ion-grid>
        </div>
      </div>
  
  <div class="page-container">
    
    <!-- Loading Spinner -->
    <ion-spinner *ngIf="isLoading" class="loading-spinner" name="crescent"></ion-spinner>

    <!-- Display Message if No Notifications Found -->
    <div *ngIf="!isLoading && notifications.length === 0" class="no-notifications">
      <p>{{ 'MESSAGES.NO_NOTIFICATIONS' | translate }}</p>
    </div>

    <!-- Notifications List -->
    <ion-list *ngIf="!isLoading && notifications.length > 0" class="notification-list">
   
      <ion-accordion-group [value]="expandedNotificationId">
        <ion-accordion *ngFor="let notification of notifications" [value]="notification.notificationId">
          
          <!-- Compact Row (Title & Date) -->
          <ion-item 
              slot="header"
              class="notification-item"
              [ngClass]="{ 'unread-notification': !notification.isRead }"
              (click)="toggleNotification(notification)"
              >
            <div class="notification-grid">
              
              <!-- Notification Title -->
              <div class="notification-title">
                <span>{{ notification.title }}</span>
              </div>

              <!-- Date Column -->
              <div class="notification-date">
                <span class="date">{{ notification.createdAt | date: 'yyyy.MM.dd' }}</span>
                <span class="time">{{ notification.createdAt | date: 'HH:mm' }}</span>
              </div>

              <!-- Delete Button -->
              <div class="notification-button-container">
                <ion-button fill="clear" color="danger" class="notification-button" 
                  (click)="deleteNotification(notification); $event.stopPropagation();">
                  <ion-icon slot="icon-only" name="trash"></ion-icon>
                </ion-button>
              </div>

            </div>
          </ion-item>

          <!-- Expanded Content (Message Body & Details) -->
          <div slot="content" class="notification-content" (click)="openNotificationLink(notification)">
            <div class="notification-grid">
              <p>{{ notification.message }}</p>
            </div>
          </div>

        </ion-accordion>
      </ion-accordion-group>

    </ion-list>

  </div>
</ion-content>
