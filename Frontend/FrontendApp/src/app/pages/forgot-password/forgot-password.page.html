<ion-content class="ion-padding">
  <div class="welcome-container">
    <h2>Forgot Password</h2>
    <p class="forgot-password-text">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submitRequest()">
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input formControlName="email" type="email"></ion-input>
      </ion-item>
      <div class="validation-message">
        <p class="error" *ngIf="f['email'].invalid && f['email'].touched">
          Please enter a valid email.
        </p>
      </div>

      <div class="button-group">
        <ion-button expand="full" color="primary" class="rounded-button" type="submit" [disabled]="forgotPasswordForm.invalid">
          Send Reset Link
        </ion-button>
      </div>
    </form>

    <p class="back-link">
      <a (click)="navigateToLogin()">Back to Login</a>
    </p>
  </div>
</ion-content>
