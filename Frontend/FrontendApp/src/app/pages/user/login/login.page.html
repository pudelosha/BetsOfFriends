<ion-content fullscreen (ionScroll)="onScroll($event)" scrollEvents="true">
  <div class="parallax-container">

    <!-- Parallax Background -->
    <div class="parallax-bg" [ngStyle]="{ 'transform': 'translateY(' + parallaxOffset + 'px)' }"></div>

    <!-- Foreground Content -->
    <div class="unauth-container">
      <h2>Login</h2>
      <p>Enter your credentials to access your account.</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <!-- Email Field -->
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input formControlName="email" type="email"></ion-input>
        </ion-item>
        <div class="validation-message">
          <p class="error" *ngIf="f['email'].invalid && f['email'].touched">
            Please enter a valid email.
          </p>
        </div>

        <!-- Password Field -->
        <ion-item>
          <ion-label position="floating">Password</ion-label>
          <ion-input formControlName="password" type="password"></ion-input>
        </ion-item>
        <div class="validation-message">
          <p class="error" *ngIf="f['password'].invalid && f['password'].touched">
            Password is required.
          </p>
        </div>

        <!-- Action Links -->
        <p class="forgot-password">
          <a (click)="navigateToForgotPassword()">Forgot Password?</a> | 
          <a (click)="navigateToResendActivation()">Didn't receive an activation email?</a>
        </p>

        <div class="button-group">
          <ion-button expand="full" color="medium" class="rounded-button" type="submit" [disabled]="loginForm.invalid">
            Login
          </ion-button>
        </div>
      </form>

      <p class="switch-auth">
        Don't have an account? <a (click)="navigateToRegister()">Sign Up</a>
      </p>
    </div>
    
  </div>
</ion-content>
