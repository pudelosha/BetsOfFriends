<div class="tournament-results-box" (click)="goToMyBets()">
  <h2 class="frame-title">{{ 'TOURNAMENT_RESULTS.TITLE' | translate }}</h2>

  <ion-list class="tournament-results-list" *ngIf="players.length > 0">
    <ion-item *ngFor="let player of players; let i = index" class="tournament-results-item">
      <div class="results-grid">
        <!-- Position -->
        <span class="position">{{ getDisplayPosition(i) }}.</span>

        <!-- Player Name -->
        <span class="player-name" [ngClass]="{ 'highlight-player': player.isCurrentUser }">
          {{ player.userName }} <span *ngIf="player.isCurrentUser">({{ 'TOURNAMENT_RESULTS.YOU' | translate }})</span>
        </span>

        <!-- Points -->
        <span class="points">{{ player.points | number:'1.2-2' }}</span>
      </div>
    </ion-item>
  </ion-list>

  <p class="no-results-message" *ngIf="players.length === 0">
    {{ 'TOURNAMENT_RESULTS.NO_DATA' | translate }}
  </p>
</div>
