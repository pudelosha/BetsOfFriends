<div class="tournament-summary-box" (click)="goToMyBets()">
  <h2 class="frame-title">{{ 'TOURNAMENT_SUMMARY.TITLE' | translate }}</h2>

  <ion-list class="tournament-summary-list" *ngIf="players.length > 0">
    <ion-item *ngFor="let player of players" class="tournament-summary-item">
      <div class="summary-grid">
        <!-- Position -->
        <span class="position">{{ player.position }}.</span>

        <!-- Player Name -->
        <span class="player-name" [ngClass]="{ 'highlight-player': player.isCurrentUser }">
          {{ player.userName }} <span *ngIf="player.isCurrentUser">({{ 'TOURNAMENT_SUMMARY.YOU' | translate }})</span>
        </span>

        <!-- Points -->
        <span class="points">{{ player.points }}</span>
      </div>
    </ion-item>
  </ion-list>

  <p class="no-summary-message" *ngIf="players.length === 0">
    {{ 'TOURNAMENT_SUMMARY.NO_DATA' | translate }}
  </p>
</div>
