<div class="tournament-summary-box">
  <h2 class="frame-title">Tournament Summary</h2>

  <ion-list class="tournament-summary-list" *ngIf="tournamentSummary.length > 0">
    <ion-item *ngFor="let player of tournamentSummary" class="tournament-summary-item">
      <div class="summary-grid">
        <!-- Position -->
        <span class="position"> {{ player.position }}. </span>

        <!-- Player Name -->
        <span class="player-name" [ngClass]="{ 'highlight-player': player.isCurrentUser }">
          {{ player.name }} <span *ngIf="player.isCurrentUser">(you)</span>
        </span>

        <!-- Points -->
        <span class="points">{{ player.points }} points</span>
      </div>
    </ion-item>
  </ion-list>

  <p class="no-summary-message" *ngIf="tournamentSummary.length === 0">No tournament data available.</p>
</div>
