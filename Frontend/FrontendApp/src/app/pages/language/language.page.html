<ion-content fullscreen (ionScroll)="onScroll($event)" scrollEvents="true">
  <div class="parallax-container">

    <!-- Parallax Background -->
    <div class="parallax-bg" [ngStyle]="{ transform: 'translateY(' + parallaxOffset + 'px)' }"></div>

    <!-- Foreground Content -->
    <div class="unauth-container">
      <h2>{{ headingLabel }}</h2>

      <!-- Native Declarative Picker -->
      <ion-picker>
        <ion-picker-column [value]="selectedLang" (ionChange)="onLangChange($event)">
          <ion-picker-column-option *ngFor="let lang of availableLanguages" [value]="lang.shortName">
            {{ lang.longName }}
          </ion-picker-column-option>
        </ion-picker-column>
      </ion-picker>

      <!-- Continue Button -->
      <div class="button-group" style="margin-top: 20px;">
        <ion-button expand="full" color="medium" class="rounded-button" (click)="onContinue()">
          {{ continueLabel }}
        </ion-button>
      </div>      

    </div>
  </div>
</ion-content>
