<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button size="small" class="gray">🌐</ion-fab-button>
  <ion-fab-list side="top">
    <ion-fab-button *ngFor="let lang of supportedLangs" size="small" (click)="switchLang(lang)">
      {{ lang.toUpperCase() }}
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>
