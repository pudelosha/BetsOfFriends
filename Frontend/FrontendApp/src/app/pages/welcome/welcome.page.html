<ion-content fullscreen (ionScroll)="onScroll($event)" scrollEvents="true">
  <div class="parallax-container">

    <!-- Parallax Background -->
    <div class="parallax-bg" [ngStyle]="{ transform: 'translateY(' + parallaxOffset + 'px)' }"></div>

    <!-- Foreground Content -->
    <div class="content">
      <h1 class="app-title">{{ 'WELCOME.TITLE' | translate }}</h1>
      <h5 class="app-slogan">{{ 'WELCOME.SLOGAN' | translate }}</h5>
      <p class="app-description">
        {{ 'WELCOME.DESCRIPTION' | translate }}
      </p>

      <div class="button-group">
        <ion-button color="medium" class="rounded-button" (click)="navigateToLogin()">
          {{ 'WELCOME.LOGIN' | translate }}
        </ion-button>
        <ion-button color="dark" class="rounded-button" (click)="navigateToRegister()">
          {{ 'WELCOME.REGISTER' | translate }}
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>

<app-language-fab></app-language-fab>
