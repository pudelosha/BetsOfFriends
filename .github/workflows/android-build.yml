name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js 20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install project dependencies
      - name: Install dependencies
        working-directory: Frontend/FrontendApp
        run: npm install

      # Install Ionic CLI globally
      - name: Install Ionic CLI
        run: npm install -g @ionic/cli

      # Build Ionic web app
      - name: Build Ionic app
        working-directory: Frontend/FrontendApp
        run: ionic build

      # Make sure Capacitor packages are up to date
      - name: Install Capacitor packages
        working-directory: Frontend/FrontendApp
        run: npm install @capacitor/core@7.2.0 @capacitor/cli@7.2.0 @capacitor/android@7.2.0 --save-exact

      # Capacitor sync
      - name: Capacitor sync
        working-directory: Frontend/FrontendApp
        run: npx cap sync android

      # Install Java 21 explicitly
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # Verify Java version
      - name: Verify Java installation
        run: |
          java -version
          javac -version

      # Build Android AAB
      - name: Build Android app bundle
        working-directory: Frontend/FrontendApp/android
        run: ./gradlew bundleRelease --warning-mode all

      # Upload Android AAB as artifact
      - name: Upload Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: Frontend/FrontendApp/android/app/build/outputs/bundle/release/app-release.aab
