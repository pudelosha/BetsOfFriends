name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: ⚡ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install npm dependencies
        working-directory: Frontend/FrontendApp
        run: npm install

      - name: 📐 Install Ionic CLI
        run: npm install -g @ionic/cli

      - name: 🛠 Build Ionic app
        working-directory: Frontend/FrontendApp
        run: ionic build

      - name: 🔗 Sync Capacitor
        working-directory: Frontend/FrontendApp
        run: npx cap sync

      - name: ☕ Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔑 Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > Frontend/FrontendApp/android/my-release-key.jks

      - name: 🏗 Build Signed Android Bundle
        working-directory: Frontend/FrontendApp/android
        run: |
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 📤 Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: Frontend/FrontendApp/android/app/build/outputs/bundle/release/app-release.aab
